name: Gallery

# Builds the README shader gallery from source and deploys it to GitHub Pages.
# Generated WebPs are deployment artifacts, never repository content.
on:
  push:
    branches: [main]
    paths:
      - 'shaders/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gallery-pages
  cancel-in-progress: false

jobs:
  build:
    name: Render gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libwayland-egl-backend-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            pkg-config \
            libegl-mesa0 \
            libgl1-mesa-dri \
            libgbm1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: gallery

      - name: Build
        run: cargo build --release

      - name: Render gallery
        env:
          # Mesa software rasteriser; no GPU is available on the runner.
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: surfaceless
          RUST_LOG: hyprsaver=info
        run: |
          mkdir -p site/gallery
          cd site/gallery
          ../../../target/release/hyprsaver render-preview --seed 0 --fps 12 --quality 75

      - name: Write gallery landing page
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>hyprsaver shader gallery</title>
            <p>Animated shader previews for <a href="https://github.com/maravexa/hyprsaver">hyprsaver</a>.</p>
            <p>The full gallery is embedded in the project README.</p>
          </html>
          EOF

      - name: Verify Pages artifact
        run: |
          test -f site/index.html
          expected=$(find shaders -maxdepth 1 -name '*.frag' -printf '%f\n' | sed 's/\.frag$/.webp/' | sort)
          actual=$(find site/gallery -maxdepth 1 -name '*.webp' -printf '%f\n' | sort)
          test "$expected" = "$actual"
          du -sh site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy gallery
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
